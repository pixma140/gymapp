x-defaults: &def
  restart: "always"
  networks:
    - "traefik_network"

services:

  gymapp:
    build: .
    container_name: gymapp
    image: gymapp:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 80
      DATA_DIR: /app/data
      # OIDC_*, COOKIE_SECURE, PUBLIC_URL and fixture credentials come from .env.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gymapp.entrypoints=web"
      - "traefik.http.routers.gymapp.rule=Host(`gym.localhost`)"
#      - "traefik.http.routers.gymapp.service=gymapp"
#      - "traefik.http.services.gymapp.loadbalancer.server.port=3000"
#    ports:
#      - "8080:80"
    volumes:
      - ${DATA_DIR:-./db}:/app/data
    <<: *def

networks:
  traefik_network:
    external: true
