name: Verify and publish Docker image to GHCR

on:
  push:
    tags:
      - 'v*'
      - 'latest'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test, lint, build, browser workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser workflows
        run: npx playwright install --with-deps chromium

      - name: Browser workflows
        run: npm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/gymapp:latest
            ghcr.io/${{ github.repository_owner }}/gymapp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/gymapp:${{ github.sha }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect release notes
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          awk -v tag="$TAG" '
            BEGIN { inside = 0 }
            /^## / { if (inside) exit; if ($2 == tag) { inside = 1; next } }
            inside { print }
          ' RELEASE_NOTES.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "RELEASE_NOTES.md has no $TAG section; summarizing commits instead." >&2
            previous="$(git describe --tags --abbrev=0 --exclude='latest' "$TAG^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s (%h)' "$previous..$TAG" > release-notes.md
            else
              git log --no-merges --pretty='- %s (%h)' "$TAG" > release-notes.md
            fi
          fi
          printf '\nDocker image: `ghcr.io/%s/gymapp:%s` (linux/amd64, linux/arm64).\n' \
            "$OWNER" "$TAG" >> release-notes.md

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          options=(--title "Release $TAG" --notes-file release-notes.md)
          case "$TAG" in
            *-*) options+=(--prerelease) ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" "${options[@]}"
          else
            gh release create "$TAG" --verify-tag "${options[@]}"
          fi
