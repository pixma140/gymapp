workflow:
  name: Verify and publish Docker image
  rules:
    - if: '$CI_COMMIT_TAG == "latest" || $CI_COMMIT_TAG =~ /^v.*$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - verify
  - image
  - publish

verify:
  stage: verify
  image: node:25.8.2-bookworm
  rules:
    - when: on_success
  script:
    - npm ci
    - npm test
    - npm run lint
    - npm run build
    - npx playwright install --with-deps chromium
    - npm run test:browser
  artifacts:
    when: on_failure
    paths:
      - test-results/
      - playwright-report/
    expire_in: 1 week

image-build:
  stage: image
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  needs: [verify]
  rules:
    - when: on_success
  before_script:
    - docker run --privileged --rm tonistiigi/binfmt --install amd64,arm64
    - docker buildx create --use --name verification-builder
  script:
    - docker buildx build --file Dockerfile --platform linux/amd64,linux/arm64 .

publish-image:
  stage: publish
  needs: [verify, image-build]
  rules:
    - if: '$CI_COMMIT_TAG == "latest" || $CI_COMMIT_TAG =~ /^v.*$/'
    - when: never
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker run --privileged --rm tonistiigi/binfmt --install amd64,arm64
    - docker buildx create --use --name multiarch-builder
  script:
    - >-
      docker buildx build
      --file Dockerfile
      --platform linux/amd64,linux/arm64
      --tag "$CI_REGISTRY_IMAGE:latest"
      --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      --push
      .
